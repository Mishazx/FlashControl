<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FlashControl — аудит USB</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="FlashControl">
        <span class="brand-mark" aria-hidden="true">FC</span>
        <span><strong>FlashControl</strong><small>USB AUDIT</small></span>
      </a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="#dashboard" data-page="dashboard"><span>⌁</span>Обзор</a>
        <a href="#devices" data-page="devices"><span>▣</span>USB-устройства</a>
        <a href="#computers" data-page="computers"><span>▤</span>Компьютеры</a>
        <a href="#events" data-page="events"><span>≋</span>События</a>
        <a href="#alerts" data-page="alerts"><span>△</span>Коллизии</a>
        <a href="#audit" data-page="audit" data-roles="admin,security" hidden><span>◎</span>Журнал действий</a>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot" id="server-dot"></span>
        <span><small>MAIN SERVER</small><strong id="server-status">Проверка…</strong></span>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="menu-button" id="menu-button" aria-label="Открыть меню">☰</button>
        <div>
          <p class="eyebrow" id="page-eyebrow">ЦЕНТР МОНИТОРИНГА</p>
          <h1 id="page-title">Обзор</h1>
        </div>
        <div class="topbar-actions">
          <span class="user-chip" id="user-chip">…</span>
          <span class="utc-clock" id="utc-clock">UTC --:--:--</span>
          <button class="button ghost" id="refresh-button">Обновить</button>
          <button class="button ghost" id="logout-button">Выйти</button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Детальная информация" aria-hidden="true">
    <div class="drawer-head">
      <div><p class="eyebrow" id="drawer-eyebrow">ДЕТАЛИ</p><h2 id="drawer-title">Карточка</h2></div>
      <button class="icon-button" id="drawer-close" aria-label="Закрыть">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
