server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $flashcontrol_upstream http://flashcontrol-main:8000;

        proxy_pass $flashcontrol_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never trust certificate identity headers supplied by an HTTP client.
        proxy_set_header X-FlashControl-Client-Verify "";
        proxy_set_header X-FlashControl-Client-Fingerprint "";
    }
}
